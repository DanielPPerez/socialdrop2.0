[project]
name = "socialdrop"
version = "0.1.0"
description = "Drop a video and a markdown file into a folder. Every platform publishes itself."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "socialdrop contributors" }]
keywords = ["social-media", "video", "publishing", "scheduler", "shorts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "rich>=13.7",
    "keyring>=25",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "openai>=1.0",
]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2"]
bluesky = ["atproto>=0.0.55"]
watch = ["watchdog>=4.0"]
mcp = ["mcp>=1.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "email-validator>=2.1"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "respx>=0.21", "keyrings.alt>=4.2"]

[project.scripts]
socialdrop = "socialdrop.cli:app"

[project.urls]
Homepage = "https://github.com/DanielPPerez/socialdrop2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socialdrop"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
